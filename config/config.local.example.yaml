# Local configuration overrides
# Copy to config.local.yaml (gitignored) and customize.
# Any key here overrides the same key in config.yaml.
# Secrets (API keys, tokens) do NOT go here — they are stored encrypted
# in config/.credentials/ via the admin panel (copilot admin) or TUI.

environment: production
debug: false

logging:
  level: INFO

# Server-side AI used for background jobs (briefings, drafting, detection).
# Providers: openai, anthropic, azure_openai, google, local
ai:
  provider: openai
  default_model: gpt-4o-mini
  premium_model: gpt-4o
  max_output_tokens: 4096
  temperature: 0.7

database:
  driver: sqlite+aiosqlite
  name: executive_copilot.db

# Default calendar for new events (create_calendar_event, add_email_to_calendar).
calendar_defaults:
  provider: google
  account_id: you@company.com      # e.g. your work Google account
  calendar_id: primary
  timezone: America/Mexico_City
  default_duration_minutes: 60
  personal_events_private: true    # events found in personal mail are private

# Which mailboxes are reviewed for e-mails that need a calendar entry.
email_calendar:
  source_accounts: []              # empty = every Outlook account
  days_back: 7
  max_emails: 60
  ignore_senders: []               # e.g. ["netflix.com", "promo@shop.com"]

# Obsidian meeting notes (from Gemini notes/transcripts).
# The vault path itself lives in the repo's .env as OBSIDIAN_VAULT_PATH so the
# Docker bind mount and the app use the same value.
obsidian:
  enabled: true
  meetings_folder: Work/Meetings
  people_folder: Work/People
  series_map: {}                   # regex on meeting title -> note name
  skip_titles: []                  # regexes of meetings never synced
  index_folders: [Work]            # folders the assistant can search (default: top folder of meetings_folder)
  index_exclude: []                # globs never indexed, e.g. ["Work/Private/*"]
