# Email Forward Rules
# Define automatic email forwarding rules based on sender, subject, or other criteria

email_forward_rules:
  - name: anthropic_invoices
    description: Forward Anthropic invoices to accounting
    enabled: true
    conditions:
      from_email: "invoice+statements@mail.anthropic.com"
    action:
      forward_to: "invoicing@paycode.com.mx"
      add_message: |
        Hola equipo de facturación,

        Les reenvío esta factura de Anthropic para su procesamiento.

        Gracias,
        Gonzalo
      mark_as_read: true
      add_label: "forwarded/accounting"

