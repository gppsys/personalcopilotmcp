# Executive Copilot on Docker.
#
#   docker compose up -d --build          admin panel + automation (port 8090)
#   docker compose --profile http up -d   + MCP over streamable HTTP (port 8091)
#
# MCP clients that speak stdio (Claude Desktop) run the server inside the
# running container:  docker exec -i copilot-admin /opt/venv/bin/python -m executive_copilot.mcp
#
# Settings come from .env (gitignored): OBSIDIAN_VAULT_PATH and TZ.

x-copilot: &copilot
  build: .
  init: true
  # The repo is mounted so config/, credentials, SQLite DBs and cache files
  # (briefing_cache.json, dashboard_done_items.json, tech_dashboard.html)
  # are shared with the host and survive container restarts. The Obsidian
  # vault is mounted at the same absolute path so one setting works on the
  # host and in the container.
  volumes:
    - .:/app
    - ${OBSIDIAN_VAULT_PATH:?Set OBSIDIAN_VAULT_PATH in .env}:${OBSIDIAN_VAULT_PATH}
  environment:
    - UV_PROJECT_ENVIRONMENT=/opt/venv
    - TZ=${TZ:-America/Mexico_City}
    - OBSIDIAN_VAULT_PATH=${OBSIDIAN_VAULT_PATH}
    - COPILOT_WORKSPACE_ACCESS_TOKEN=${COPILOT_WORKSPACE_ACCESS_TOKEN:-}
    - COPILOT_KNOWLEDGE_DATABASE_URL=${COPILOT_KNOWLEDGE_DATABASE_URL:-}
    - COPILOT_KNOWLEDGE_GITHUB_TOKEN=${COPILOT_KNOWLEDGE_GITHUB_TOKEN:-}
  restart: unless-stopped

services:
  copilot:
    <<: *copilot
    container_name: copilot-admin
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  # MCP over HTTP for clients that support it (Claude Code: `claude mcp add
  # --transport http copilot http://127.0.0.1:8091/mcp`). It has no
  # authentication by default; a workspace key protects it when configured.
  # It is bound to localhost only. Opt in with --profile http.
  copilot-mcp-http:
    <<: *copilot
    container_name: copilot-mcp-http
    profiles: ["http"]
    command: ["/opt/venv/bin/copilot", "mcp", "--transport", "http", "--host", "0.0.0.0", "--port", "8091"]
    ports:
      - "127.0.0.1:8091:8091"

  # Optional knowledge index. Existing Copilot databases remain untouched.
  knowledge-mysql:
    image: mysql:8.4
    profiles: ["knowledge"]
    environment:
      MYSQL_DATABASE: copilot_knowledge
      MYSQL_USER: copilot_knowledge
      MYSQL_PASSWORD: ${KNOWLEDGE_MYSQL_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${KNOWLEDGE_MYSQL_ROOT_PASSWORD:-}
    volumes:
      - knowledge_mysql:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  knowledge_mysql:
