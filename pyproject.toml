[project]
name = "executive-copilot"
version = "0.1.0"
description = "Executive Copilot - MCP-based intelligent assistant platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Gonzalo Pastor", email = "gonzalo@paycode.com.mx" }
]
keywords = ["mcp", "copilot", "assistant", "automation", "executive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Typing :: Typed",
]

dependencies = [
    "fastmcp>=2.0.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.0",
    # Admin panel
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pyyaml>=6.0.0",
    "cryptography>=43.0.0",
    # TUI
    "rich>=13.9.0",
    "openai>=2.0.0",
    "numpy>=2.5.3",
    "asyncmy>=0.2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
copilot = "executive_copilot.cli:main"
copilot-mcp = "executive_copilot.mcp.server:main"
copilot-admin = "executive_copilot.admin.server:main"
copilot-tui = "executive_copilot.tui.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/executive_copilot"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # Pylint
    "RUF",    # Ruff-specific
    "ASYNC",  # flake8-async
]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR2004",  # Magic value comparison
    "PLC0415",  # Import outside top-level (used to avoid circular imports)
    "PLR0912",  # Too many branches
    "PLR0915",  # Too many statements
    "PLR0911",  # Too many return statements
    "PLW0603",  # Global statement
    "PLW2901",  # Overwriting loop variable
    "E501",     # Line too long (many pre-existing)
    "E402",     # Module level import not at top
    "F821",     # Undefined name (forward references in CLI)
    "F841",     # Unused variable
    "SIM102",   # Nested if statements
    "SIM105",   # Use contextlib.suppress
    "SIM110",   # Use any/all
    "B904",     # Raise from within except
    "B007",     # Unused loop variable
    "B024",     # Abstract base class without abstract methods
    "C401",     # Unnecessary generator
    "PTH123",   # Use Path.open
    "PTH101",   # Use Path.chmod
    "UP046",    # Replace with `type` parameter
    "TC002",    # Move import into type-checking block
    "RUF001",   # Ambiguous unicode character
    "RUF022",   # Unsorted __all__
]

[tool.ruff.lint.isort]
known-first-party = ["executive_copilot"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002", "PLR2004"]
"src/**/*.py" = ["ARG001", "ARG002"]  # Unused arguments in callbacks/interfaces

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "sqlmodel.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/executive_copilot"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
